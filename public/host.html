<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Last Laugh</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { height: 100vh; overflow: hidden; font-size: clamp(14px, 1.25vw, 26px); }
    #app { height: 100vh; display: flex; flex-direction: column; padding: 2.2em 3em; }
    header { display: flex; justify-content: space-between; align-items: center; min-height: 96px; }
    header .small-logo { font-family: var(--display); font-size: 1.6em; color: var(--yellow); transform: rotate(-3deg); }
    header .code-tag { font-family: var(--display); font-size: 1.2em; background: #ffffff15; padding: .4em .9em; border-radius: 12px; }
    header .code-tag b { color: var(--yellow); }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 0; }

    /* lobby */
    .lobby { display: grid; grid-template-columns: 1fr 1.1fr; gap: 4em; width: 100%; align-items: center; }
    .lobby .logo { font-size: 6.5em; margin-bottom: .4em; }
    .joinbox { background: #ffffff10; border: 3px solid #ffffff22; border-radius: 28px; padding: 1.6em; display: flex; gap: 1.6em; align-items: center; }
    .joinbox img { width: 12em; height: 12em; border-radius: 16px; background: #fff; }
    .joinbox .step { font-size: 1.1em; color: var(--muted); margin: .2em 0; }
    .joinbox .url { font-weight: 900; font-size: 1.3em; word-break: break-all; }
    .joinbox .code { font-family: var(--display); font-size: 4.6em; color: var(--yellow); letter-spacing: .08em; line-height: 1; }
    .slots { display: grid; grid-template-columns: 1fr 1fr; gap: .9em; }
    .slot { height: 3.6em; border-radius: 18px; border: 3px dashed #ffffff30; display: flex; align-items: center; padding: 0 1em; gap: .7em; font-weight: 900; font-size: 1.4em; color: #ffffff40; }
    .slot.filled { border: none; color: var(--cardInk); animation: pop .45s cubic-bezier(.2,1.4,.4,1) both; }
    .slot .crown { margin-left: auto; font-size: .7em; background: #00000025; padding: .2em .6em; border-radius: 99px; }
    .lobby-foot { margin-top: 1.4em; display: flex; gap: 1em; align-items: center; justify-content: space-between; }
    .lobby-foot .hint { color: var(--muted); font-size: 1.1em; }

    /* big headings */
    .huge { font-family: var(--display); font-size: 8em; line-height: 1; text-align: center; text-shadow: 0 8px 0 var(--pink); }
    .sub { font-size: 1.8em; color: var(--muted); text-align: center; margin-top: .6em; max-width: 30em; }
    .prompt { font-family: var(--display); font-size: 3em; text-align: center; max-width: 22em; line-height: 1.15; margin-bottom: 1.2em; }

    .chips { display: flex; flex-wrap: wrap; gap: .7em; justify-content: center; margin-top: 2em; }
    .chip { padding: .5em 1em; border-radius: 99px; font-weight: 900; font-size: 1.2em; color: var(--cardInk); opacity: .35; transition: .3s; }
    .chip.done { opacity: 1; transform: scale(1.08); }
    .chip.done::after { content: ' ✓'; }

    /* matchup */
    .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 2em; align-items: stretch; width: 100%; max-width: 70em; }
    .vs .mid { font-family: var(--display); font-size: 3em; align-self: center; color: var(--pink); }
    .answer { background: var(--card); color: var(--cardInk); border-radius: 26px; padding: 1.4em 1.6em; font-size: 2.2em; font-weight: 900; text-align: center; min-height: 4.5em; display: flex; flex-direction: column; justify-content: center; position: relative; box-shadow: 0 10px 0 #00000040; }
    .answer:nth-child(1) { transform: rotate(-1.5deg); }
    .answer:nth-child(3) { transform: rotate(1.5deg); }
    .answer .who { font-size: .55em; margin-top: .8em; padding: .3em .8em; border-radius: 99px; align-self: center; color: var(--cardInk); }
    .answer .votes { font-family: var(--display); font-size: .9em; color: var(--pink); }
    .answer .pts { position: absolute; top: -.8em; right: -.6em; background: var(--yellow); font-family: var(--display); font-size: .6em; padding: .3em .7em; border-radius: 14px; transform: rotate(8deg); }
    .answer .voters { display: flex; gap: .3em; justify-content: center; flex-wrap: wrap; margin-top: .5em; }
    .answer .voters span { font-size: .45em; padding: .2em .6em; border-radius: 99px; color: var(--cardInk); }
    .answer.winner { outline: 8px solid var(--yellow); }
    .answer.noanswer { opacity: .5; font-style: italic; }
    .banner { font-family: var(--display); font-size: 3em; color: var(--yellow); margin-top: 1em; text-align: center; animation: wobble .6s infinite; }
    .count { color: var(--muted); font-size: 1.3em; margin-top: 1.4em; }

    /* scores */
    .board { width: 100%; max-width: 50em; display: flex; flex-direction: column; gap: .7em; }
    .row { display: flex; align-items: center; gap: 1em; font-size: 1.6em; font-weight: 900; }
    .row .rank { font-family: var(--display); width: 2em; text-align: right; color: var(--muted); }
    .row .bar { height: 2.2em; border-radius: 14px; display: flex; align-items: center; padding: 0 .8em; color: var(--cardInk); min-width: 6em; transition: width 1.2s cubic-bezier(.2,.9,.3,1); white-space: nowrap; }
    .row .score { font-family: var(--display); }
    .row .gain { color: var(--teal); font-size: .8em; }

    /* final */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(16em, 1fr)); gap: 1.2em; width: 100%; max-width: 80em; }
    .grid .answer { font-size: 1.6em; min-height: 3.6em; transform: none !important; }
    .grid .answer .tag { position: absolute; top: .4em; left: .6em; font-family: var(--display); font-size: .6em; color: var(--pink); }

    .winner-name { font-family: var(--display); font-size: 6em; text-align: center; line-height: 1; animation: float 2s infinite; }
    .crown-big { font-size: 4em; text-align: center; animation: wobble 1s infinite; }

    .toolbar { position: fixed; bottom: 1em; right: 1em; display: flex; gap: .5em; opacity: .35; transition: opacity .2s; }
    .toolbar:hover { opacity: 1; }
    .toolbar button { background: #ffffff22; color: #fff; border: none; border-radius: 10px; padding: .5em .9em; font-weight: 700; }
    #soundHint { position: fixed; top: 1em; left: 50%; transform: translateX(-50%); background: var(--pink); padding: .5em 1.2em; border-radius: 99px; font-weight: 900; cursor: pointer; animation: pulse 1s infinite alternate; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="small-logo" id="hdrLogo">LAST LAUGH</div>
      <div id="hdrMid" class="code-tag hidden"></div>
      <div id="hdrTimer"></div>
    </header>
    <main id="main"><div class="huge">LOADING…</div></main>
  </div>
  <div id="soundHint">🔊 Click anywhere to turn on the narrator & sound</div>
  <div class="toolbar">
    <button id="muteBtn">🔊 Narrator on</button>
    <button id="skipBtn">⏭ Skip timer</button>
    <button id="fsBtn">⛶ Fullscreen</button>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/host.js"></script>
</body>
</html>
